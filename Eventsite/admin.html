<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Event's - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="adminStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Add Firebase SDK from jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/firebase@9.22.2/firebase-app-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/firebase@9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="admin-container">
        <div class="login-container" id="loginContainer">
            <h2>Admin Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="adminUsername">Username</label>
                    <input type="text" id="adminUsername" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>

        <div class="dashboard-container" id="dashboardContainer" style="display: none;">
            <header class="admin-header" style="padding: 0px 20px;">
                <h1>Admin Dashboard</h1>
                <div class="header-actions">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search bookings...">
                        <i class="fas fa-search"></i>
                    </div>
                    <button id="logoutBtn" class="btn">Logout</button>
                </div>
            </header>

            <div class="bookings-container">
                <div class="bookings-header">
                    <h2>Event Bookings</h2>
                    <div class="filter-options">
                        <select id="statusFilter">
                            <option value="all">All Status</option>
                            <option value="new">New</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div class="bookings-grid" id="bookingsGrid">
                    <!-- Bookings will be populated here as cards -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDg2i0TFLVWYO4diGLrgzNUt_F2Kxv-7EA",
            authDomain: "learning-e43b9.firebaseapp.com",
            projectId: "learning-e43b9",
            storageBucket: "learning-e43b9.firebasestorage.app",
            messagingSenderId: "484671413507",
            appId: "1:484671413507:web:950661807dcd64ba699d36"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            
            // Admin credentials
            const ADMIN_USERNAME = "admin";
            const ADMIN_PASSWORD = "admin123";

            // DOM elements
            const loginContainer = document.getElementById('loginContainer');
            const dashboardContainer = document.getElementById('dashboardContainer');
            const loginForm = document.getElementById('loginForm');
            const logoutBtn = document.getElementById('logoutBtn');
            const bookingsGrid = document.getElementById('bookingsGrid');
            const searchInput = document.getElementById('searchInput');
            const statusFilter = document.getElementById('statusFilter');

            // Check if user is already logged in
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                showDashboard();
                loadBookings();
            }

            // Login form submission
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('adminUsername').value;
                const password = document.getElementById('adminPassword').value;

                if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    showDashboard();
                    loadBookings();
                } else {
                    alert('Invalid credentials');
                }
            });

            // Logout button click
            logoutBtn.addEventListener('click', () => {
                sessionStorage.removeItem('adminLoggedIn');
                showLogin();
            });

            // Search functionality
            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const cards = document.querySelectorAll('.booking-card');
                
                cards.forEach(card => {
                    const text = card.textContent.toLowerCase();
                    console.log(text)
                    card.style.display = text.includes(searchTerm) ? 'block' : 'none';
                });
            });

            // Status filter functionality
            statusFilter.addEventListener('change', (e) => {
                const selectedStatus = e.target.value;
                const cards = document.querySelectorAll('.booking-card');
                
                cards.forEach(card => {
                    const cardStatus = card.dataset.status;
                    card.style.display = (selectedStatus === 'all' || cardStatus === selectedStatus) ? 'block' : 'none';
                });
            });

            function showDashboard() {
                loginContainer.style.display = 'none';
                dashboardContainer.style.display = 'block';
            }

            function showLogin() {
                loginContainer.style.display = 'block';
                dashboardContainer.style.display = 'none';
            }

            function getStatusColor(status) {
                switch(status) {
                    case 'new': return '#ff9800';
                    case 'in-progress': return '#2196f3';
                    case 'completed': return '#4caf50';
                    default: return '#9e9e9e';
                }
            }

            function getStatusText(status) {
                switch(status) {
                    case 'new': return 'New';
                    case 'in-progress': return 'In Progress';
                    case 'completed': return 'Completed';
                    default: return 'Unknown';
                }
            }

            async function loadBookings() {
                try {
                    const querySnapshot = await db.collection("eventBookings")
                        .orderBy("timestamp", "desc")
                        .get();
                    
                    bookingsGrid.innerHTML = '';
                    
                    querySnapshot.forEach((doc) => {
                        const booking = doc.data();
                        const card = document.createElement('div');
                        card.className = 'booking-card';
                        card.dataset.status = booking.status || 'new';
                        
                        card.innerHTML = `
                            <div class="card-header">
                                <h3>${booking.name}</h3>
                                <span class="status-badge" style="background-color: ${getStatusColor(booking.status)}">
                                    ${getStatusText(booking.status)}
                                </span>
                            </div>
                            <div class="card-body">
                                <div class="info-row">
                                    <i class="fas fa-calendar"></i>
                                    <span>${booking.eventDate}</span>
                                </div>
                                <div class="info-row">
                                    <i class="fas fa-envelope"></i>
                                    <span>${booking.email}</span>
                                </div>
                                <div class="info-row">
                                    <i class="fas fa-phone"></i>
                                    <span>${booking.phone}</span>
                                </div>
                                <div class="info-row">
                                    <i class="fas fa-map-marker-alt"></i>
                                    <span>${booking.address}</span>
                                </div>
                                <div class="info-row">
                                    <i class="fas fa-gift"></i>
                                    <span>${booking.eventType}</span>
                                </div>
                                <div class="message-row">
                                    <i class="fas fa-comment"></i>
                                    <p>${booking.message || 'No message provided'}</p>
                                </div>
                            </div>
                            <div class="card-footer">
                                <select class="status-select" data-id="${doc.id}">
                                    <option value="new" ${booking.status === 'new' ? 'selected' : ''}>New</option>
                                    <option value="in-progress" ${booking.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                                    <option value="completed" ${booking.status === 'completed' ? 'selected' : ''}>Completed</option>
                                </select>
                                <button class="btn-delete" data-id="${doc.id}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        `;
                        
                        bookingsGrid.appendChild(card);
                    });

                    // Add event listeners for status changes
                    document.querySelectorAll('.status-select').forEach(select => {
                        select.addEventListener('change', async (e) => {
                            const bookingId = e.target.dataset.id;
                            const newStatus = e.target.value;
                            await db.collection("eventBookings").doc(bookingId).update({
                                status: newStatus
                            });
                            loadBookings(); // Refresh the cards
                        });
                    });

                    // Add event listeners for delete buttons
                    document.querySelectorAll('.btn-delete').forEach(button => {
                        button.addEventListener('click', async (e) => {
                            const bookingId = e.target.closest('.btn-delete').dataset.id;
                            if (confirm('Are you sure you want to delete this booking?')) {
                                await db.collection("eventBookings").doc(bookingId).delete();
                                loadBookings(); // Refresh the cards
                            }
                        });
                    });

                } catch (error) {
                    console.error("Error loading bookings: ", error);
                    alert("Error loading bookings. Please try again.");
                }
            }
        } catch (error) {
            console.error("Firebase initialization error: ", error);
            alert("Error initializing Firebase. Please check your internet connection and try again.");
        }
    </script>
</body>
</html>
